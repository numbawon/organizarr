name: Build and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Manual trigger. Mainly so a rotated DOCKERHUB_TOKEN can be verified
  # without inventing a commit -- an untested registry credential is a
  # latent failure that only surfaces on the next real release.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is optional and additive. Gated on the DOCKERHUB_USERNAME
      # repo variable so a fork, or this repo before the credentials were
      # set, still builds and publishes to GHCR exactly as before instead of
      # failing on a registry it was never configured for.
      - name: Log in to Docker Hub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # One build, pushed to both registries: metadata-action generates
          # the same tag set for each image listed here, and
          # build-push-action pushes them all from a single build rather
          # than building twice. The second line collapses to an empty
          # string when Docker Hub is not configured, which
          # metadata-action ignores.
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ vars.DOCKERHUB_USERNAME && format('docker.io/{0}/organizarr', vars.DOCKERHUB_USERNAME) || '' }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64

      # Docker Hub shows nothing on the listing page unless it is pushed
      # there separately -- the image had 520 pulls against an empty
      # overview. Sync it from the README so it cannot drift, rather than
      # pasting it once by hand.
      #
      # Only on the default branch: a tag build would otherwise rewrite the
      # overview from whatever that tag's README said. Skipped entirely
      # when Docker Hub is not configured, same as the push above.
      - name: Sync Docker Hub description
        if: github.ref == 'refs/heads/main' && vars.DOCKERHUB_USERNAME != ''
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/organizarr
          short-description: ${{ github.event.repository.description }}
          readme-filepath: ./README.md
